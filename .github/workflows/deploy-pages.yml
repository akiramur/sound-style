name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @sound-style/core and @sound-style/mapbox-gl
        run: pnpm --filter "@sound-style/core" --filter "@sound-style/mapbox-gl" build

      - name: Build examples/vanilla
        working-directory: examples/vanilla
        env:
          DEPLOY_BASE: /sound-style/
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          VITE_AUDIO_BASE_URL: https://cdn.jsdelivr.net/gh/akiramur/sound-style-assets@v1.1.4/
        run: pnpm exec vite build

      - name: Build examples/halloween
        working-directory: examples/halloween
        env:
          DEPLOY_BASE: /sound-style/halloween/
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          VITE_AUDIO_BASE_URL: https://cdn.jsdelivr.net/gh/akiramur/sound-style-assets@v1.1.4/
        run: pnpm exec vite build

      - name: Combine demo builds
        run: |
          mkdir -p site
          cp -r examples/vanilla/dist/. site/
          mkdir -p site/halloween
          cp -r examples/halloween/dist/. site/halloween/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
